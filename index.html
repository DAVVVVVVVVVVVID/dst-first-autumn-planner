<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🍂 第一个秋天 · DST 协作规划</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍂</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #f3e4c8;
    --paper-dark: #ead4a8;
    --wood-dark: #3d2b1e;
    --wood: #6b4a34;
    --wood-light: #8a6248;
    --ink: #3d2b1e;
    --ink-soft: #6b5544;
    --orange: #c9752f;
    --orange-deep: #a85c1f;
    --orange-light: #e8a05c;
    --red: #b3462c;
    --yellow: #c98a17;
    --green: #5f7d3f;
    --border: rgba(61,43,30,0.25);
    --card-bg: #faf1dd;
    --shadow: 0 2px 0 rgba(61,43,30,0.15), 0 6px 16px rgba(61,43,30,0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 15% 10%, rgba(232,160,92,0.25), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(107,74,52,0.15), transparent 45%),
      var(--paper);
    color: var(--ink);
    font-family: "Noto Sans SC", sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  header.app-header {
    background: linear-gradient(135deg, var(--wood-dark), var(--wood));
    color: #f3e4c8;
    border-radius: 16px;
    padding: 22px 24px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    margin-bottom: 20px;
  }
  header.app-header::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 12px);
    pointer-events: none;
  }
  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .title-row h1 {
    font-family: "Ma Shan Zheng", cursive;
    font-size: 2.2rem;
    margin: 0;
    letter-spacing: 2px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.82rem;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #7fbf6a; box-shadow: 0 0 6px #7fbf6a; }
  .dot.offline { background: #c0392b; box-shadow: 0 0 6px #c0392b; }

  .room-row {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 0.88rem;
    color: #e8d8ba;
  }
  .room-row input[type=text] {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 0.85rem;
    width: 140px;
  }
  .room-row input[type=text]::placeholder { color: #d8c6a8; }

  .online-row {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 0.82rem;
  }
  .online-label { color: #d8c6a8; }
  .online-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    color: #f3e4c8;
  }
  .online-chip .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #7fbf6a; box-shadow: 0 0 5px #7fbf6a;
  }

  button.pill-btn {
    background: var(--orange);
    color: #fff;
    border: none;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 0.82rem;
    cursor: pointer;
    font-weight: 700;
    transition: background 0.15s, transform 0.1s;
  }
  button.pill-btn:hover { background: var(--orange-deep); }
  button.pill-btn:active { transform: scale(0.96); }
  button.pill-btn.secondary {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
  }
  button.pill-btn.secondary:hover { background: rgba(255,255,255,0.28); }
  button.pill-btn:disabled { opacity: 0.6; cursor: default; }

  .template-panel { margin-bottom: 20px; }
  .template-intro {
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .template-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
  }
  .template-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .template-card .t-name {
    font-weight: 700;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .template-card .t-desc {
    font-size: 0.8rem;
    color: var(--ink-soft);
    flex: 1;
  }
  .template-card button.pill-btn { align-self: flex-start; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .stat-card h3 {
    margin: 0 0 10px;
    font-size: 0.9rem;
    color: var(--ink-soft);
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .stat-card .big-pct { font-size: 1.4rem; color: var(--orange-deep); font-weight: 900; }

  .bar-track {
    background: rgba(61,43,30,0.12);
    border-radius: 999px;
    height: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .bar-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--orange-light), var(--orange));
    transition: width 0.4s ease;
  }
  .bar-fill.required { background: linear-gradient(90deg, #d9663f, var(--red)); }

  .categories {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
  }

  .cat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .cat-header {
    padding: 14px 18px 10px;
    border-bottom: 1px dashed var(--border);
  }
  .cat-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .cat-name {
    font-size: 1.05rem;
    font-weight: 700;
  }
  .cat-actions, .task-actions {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
  }
  .task-actions { opacity: 0.55; }
  .task-item:hover .task-actions { opacity: 1; }

  .icon-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 0.82rem;
    padding: 3px 5px;
    border-radius: 6px;
    color: var(--ink-soft);
    line-height: 1;
  }
  .icon-btn:hover { background: rgba(61,43,30,0.12); color: var(--ink); }

  .cat-edit-form {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    width: 100%;
  }
  .cat-icon-input {
    width: 46px;
    text-align: center;
    padding: 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 1rem;
    font-family: inherit;
  }
  .cat-name-input {
    flex: 1;
    min-width: 100px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 0.95rem;
    font-family: inherit;
  }
  .add-cat-form { padding: 16px 18px; }

  .cat-header .cat-sub {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-top: 6px;
  }

  .task-group { padding: 10px 18px; }
  .task-group + .task-group { border-top: 1px dashed var(--border); }
  .group-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--red);
    margin: 6px 0 6px;
  }
  .group-label.optional { color: var(--yellow); }

  ul.task-list { list-style: none; margin: 0; padding: 0; }
  .task-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 4px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .task-item:hover { background: rgba(201,117,47,0.1); }
  .task-item.editing { background: rgba(201,117,47,0.08); cursor: default; }
  .task-item .box {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    border-radius: 5px;
    border: 2px solid var(--wood);
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    font-size: 0.75rem;
    color: transparent;
  }
  .task-item.done .box {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .task-item.done .label {
    text-decoration: line-through;
    color: var(--ink-soft);
  }
  .task-item .label { flex: 1; font-size: 0.92rem; }
  .task-item .by {
    font-size: 0.72rem;
    color: var(--ink-soft);
    background: rgba(61,43,30,0.08);
    padding: 2px 7px;
    border-radius: 999px;
  }
  .task-edit-input {
    flex: 1;
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-family: inherit;
    font-size: 0.9rem;
  }

  .add-task-row {
    font-size: 0.82rem;
    color: var(--orange-deep);
    cursor: pointer;
    padding: 6px 4px;
    font-weight: 600;
  }
  .add-task-row:hover { text-decoration: underline; }
  .add-task-form {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 6px 0;
  }
  .add-task-input {
    flex: 1;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-family: inherit;
    font-size: 0.9rem;
  }

  .add-cat-card {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 90px;
  }
  .add-cat-trigger {
    cursor: pointer;
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 0.95rem;
    border: 2px dashed var(--border);
    background: transparent;
    box-shadow: none;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .add-cat-trigger:hover { color: var(--orange-deep); border-color: var(--orange); }

  .name-gate {
    position: fixed;
    inset: 0;
    background: rgba(61,43,30,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .name-gate .box {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 28px;
    max-width: 360px;
    width: 100%;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .name-gate h2 { font-family: "Ma Shan Zheng", cursive; font-size: 1.8rem; margin: 0 0 6px; color: var(--wood-dark); }
  .name-gate p { color: var(--ink-soft); font-size: 0.85rem; margin: 0 0 16px; }
  .name-gate input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 1rem;
    margin-bottom: 12px;
    font-family: inherit;
  }
  .name-gate button {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: var(--orange);
    color: #fff;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .name-gate button:hover { background: var(--orange-deep); }
  .hidden { display: none !important; }

  footer.note {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.75rem;
    margin-top: 24px;
  }

  @media (max-width: 480px) {
    .title-row h1 { font-size: 1.6rem; }
    .wrap { padding: 12px 10px 30px; }
  }
</style>
</head>
<body>

<div class="name-gate" id="nameGate">
  <div class="box">
    <h2>🍂 加入营地</h2>
    <p>输入你的名字,让队友知道是谁完成了任务</p>
    <input type="text" id="nameInput" placeholder="例如: Alice" maxlength="12" />
    <button id="nameSubmit">进入</button>
  </div>
</div>

<div class="wrap">
  <header class="app-header">
    <div class="title-row">
      <h1>🍂 第一个秋天</h1>
      <span class="status-pill"><span class="dot offline" id="statusDot"></span><span id="statusText">连接中...</span></span>
    </div>
    <div class="room-row">
      <span>房间:</span>
      <input type="text" id="roomInput" readonly />
      <button class="pill-btn" id="copyLinkBtn">复制邀请链接</button>
      <button class="pill-btn secondary" id="templateBtn">📋 模板</button>
      <span id="playerLabel"></span>
    </div>
    <div class="online-row" id="onlineRow"></div>
  </header>

  <div class="stats-row">
    <div class="stat-card">
      <h3>必须任务完成度 <span class="big-pct" id="requiredPct">0%</span></h3>
      <div class="bar-track"><div class="bar-fill required" id="requiredBar" style="width:0%"></div></div>
    </div>
    <div class="stat-card">
      <h3>总进度(含可选) <span class="big-pct" id="totalPct">0%</span></h3>
      <div class="bar-track"><div class="bar-fill" id="totalBar" style="width:0%"></div></div>
    </div>
  </div>

  <div id="templatePanel"></div>

  <div class="categories" id="categories"></div>

  <footer class="note">数据实时同步给同房间的所有人 · 分享上方链接给队友即可一起协作</footer>
</div>

<script>
const SUPABASE_URL = "https://tldmpaumprctfpqzbgga.supabase.co";
const SUPABASE_KEY = "sb_publishable_cps3c_C2OJ4ph6R81PEang_o8SvPi9J";
const CATEGORIES_TABLE = "categories";
const TASKS_TABLE = "tasks";

// 模板注册表:以后新增模板(比如"第一个冬天"、"洞穴探索")直接往这个数组里加一项即可
const TEMPLATES = [
  {
    id: "first-autumn",
    icon: "🍂",
    name: "第一个秋天",
    description: "新手团队建立基地、稳定食物、准备过冬的核心任务清单",
    categories: [
      {
        icon: "🗺️", name: "探索地图",
        required: ["猪王", "牛群", "草原", "蜘蛛巢", "岩石区域", "兔子区", "发条怪物", "海象平原", "格罗姆"],
        optional: ["沼泽", "墓地", "蜂巢", "洞穴"]
      },
      {
        icon: "🌱", name: "资源移植",
        required: ["浆果丛移植", "树枝移植", "种树", "蜘蛛巢 ×3", "猪人房 ×6", "鸟笼"],
        optional: ["草移植(有草原可以不进行)", "蜂箱", "兔人房"]
      },
      {
        icon: "🏠", name: "家具必需品",
        required: ["火坑", "晾肉架", "一本科技", "二本科技", "烹饪锅 ×3", "冰箱 ×3", "帐篷", "箱子及其分类"],
        optional: ["海上科技"]
      },
      {
        icon: "⚔️", name: "装备",
        required: ["猪皮头套"],
        optional: ["矿工帽", "提灯"]
      },
      {
        icon: "❄️", name: "过冬准备",
        required: ["牛角帽 ×3", "暖石 ×6", "充足燃料"],
        optional: []
      }
    ]
  }
];

let categories = []; // {id, room, icon, name, sort_order}
let tasks = [];      // {id, room, category_id, grp, label, checked, checked_by, sort_order}
let playerName = localStorage.getItem("dst_planner_name") || "";
let room = "";
let channel = null;
let client = null;
const sessionId = crypto.randomUUID ? crypto.randomUUID() : String(Math.random());

// transient UI edit state (not persisted)
let editingCategoryId = null;
let editingTaskId = null;
let addingTaskGroup = null; // "<categoryId>:<grp>"
let addingCategory = false;
let templatePanelOpen = false;

function getOrCreateRoom() {
  const url = new URL(window.location.href);
  let r = url.searchParams.get("room");
  if (!r) {
    r = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random())).slice(0, 8);
    url.searchParams.set("room", r);
    window.history.replaceState({}, "", url.toString());
  }
  return r;
}

function setStatus(online) {
  document.getElementById("statusDot").classList.toggle("offline", !online);
  document.getElementById("statusText").textContent = online ? "实时同步中" : "离线 / 连接中";
}

function tasksFor(categoryId, grp) {
  return tasks
    .filter(t => t.category_id === categoryId && t.grp === grp)
    .sort((a, b) => a.sort_order - b.sort_order);
}

function computeProgress() {
  const required = tasks.filter(t => t.grp === "required");
  const reqDone = required.filter(t => t.checked).length;
  const allDone = tasks.filter(t => t.checked).length;
  return {
    reqPct: required.length ? Math.round((reqDone / required.length) * 100) : 0,
    allPct: tasks.length ? Math.round((allDone / tasks.length) * 100) : 0
  };
}

function catProgress(categoryId) {
  const req = tasks.filter(t => t.category_id === categoryId && t.grp === "required");
  const done = req.filter(t => t.checked).length;
  return req.length ? Math.round((done / req.length) * 100) : 0;
}

function renderStats() {
  const { reqPct, allPct } = computeProgress();
  document.getElementById("requiredPct").textContent = reqPct + "%";
  document.getElementById("requiredBar").style.width = reqPct + "%";
  document.getElementById("totalPct").textContent = allPct + "%";
  document.getElementById("totalBar").style.width = allPct + "%";
}

function makeIconBtn(symbol, title, onClick) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "icon-btn";
  btn.textContent = symbol;
  btn.title = title;
  btn.addEventListener("click", e => { e.stopPropagation(); onClick(); });
  return btn;
}

function renderApp() {
  renderTemplatePanel();
  renderCategoriesGrid();
  renderStats();
}

function renderTemplatePanel() {
  const container = document.getElementById("templatePanel");
  container.innerHTML = "";
  if (!templatePanelOpen && categories.length !== 0) return;

  const wrap = document.createElement("div");
  wrap.className = "template-panel";

  const intro = document.createElement("div");
  intro.className = "template-intro";
  intro.textContent = categories.length === 0
    ? "这个房间还没有任务卡片,选一个模板快速开始,或者在下面自己新建分类:"
    : "选一个模板,把它的卡片添加到当前房间(会追加在现有卡片后面):";
  wrap.appendChild(intro);

  const grid = document.createElement("div");
  grid.className = "template-grid";
  TEMPLATES.forEach(tpl => grid.appendChild(buildTemplateCard(tpl)));
  wrap.appendChild(grid);

  container.appendChild(wrap);
}

function buildTemplateCard(tpl) {
  const card = document.createElement("div");
  card.className = "template-card";

  const name = document.createElement("div");
  name.className = "t-name";
  name.textContent = `${tpl.icon} ${tpl.name}`;

  const desc = document.createElement("div");
  desc.className = "t-desc";
  desc.textContent = tpl.description;

  const btn = document.createElement("button");
  btn.className = "pill-btn";
  btn.type = "button";
  btn.textContent = "使用此模板";
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    btn.textContent = "添加中...";
    await applyTemplate(tpl);
    templatePanelOpen = false;
  });

  card.appendChild(name);
  card.appendChild(desc);
  card.appendChild(btn);
  return card;
}

async function applyTemplate(template) {
  let sortBase = categories.length ? Math.max(...categories.map(c => c.sort_order)) + 1 : 0;
  for (let i = 0; i < template.categories.length; i++) {
    const def = template.categories[i];
    const { data: catRow, error } = await client.from(CATEGORIES_TABLE)
      .insert({ room, icon: def.icon, name: def.name, sort_order: sortBase + i }).select().single();
    if (error || !catRow) { console.error(error); continue; }
    categories.push(catRow);
    const rows = [];
    def.required.forEach((label, idx) => rows.push({ room, category_id: catRow.id, grp: "required", label, sort_order: idx }));
    def.optional.forEach((label, idx) => rows.push({ room, category_id: catRow.id, grp: "optional", label, sort_order: idx }));
    if (rows.length) {
      const { data: taskRows, error: taskErr } = await client.from(TASKS_TABLE).insert(rows).select();
      if (taskErr) console.error(taskErr);
      else if (taskRows) tasks.push(...taskRows);
    }
  }
  renderApp();
}

function renderCategoriesGrid() {
  const wrap = document.getElementById("categories");
  wrap.innerHTML = "";
  [...categories]
    .sort((a, b) => a.sort_order - b.sort_order)
    .forEach(cat => wrap.appendChild(buildCategoryCard(cat)));
  wrap.appendChild(buildAddCategoryCard());
}

function buildCategoryCard(cat) {
  const card = document.createElement("div");
  card.className = "cat-card";

  const header = document.createElement("div");
  header.className = "cat-header";

  const topRow = document.createElement("div");
  topRow.className = "cat-top-row";

  if (editingCategoryId === cat.id) {
    topRow.appendChild(buildCategoryEditForm(cat));
  } else {
    const nameEl = document.createElement("div");
    nameEl.className = "cat-name";
    nameEl.textContent = `${cat.icon} ${cat.name}`;
    topRow.appendChild(nameEl);

    const actions = document.createElement("div");
    actions.className = "cat-actions";
    actions.appendChild(makeIconBtn("✏️", "编辑分类", () => { editingCategoryId = cat.id; renderApp(); }));
    actions.appendChild(makeIconBtn("🗑️", "删除分类", () => deleteCategory(cat)));
    topRow.appendChild(actions);

    header.appendChild(topRow);

    const bar = document.createElement("div");
    bar.className = "bar-track";
    const fill = document.createElement("div");
    fill.className = "bar-fill";
    fill.style.width = catProgress(cat.id) + "%";
    bar.appendChild(fill);
    header.appendChild(bar);

    const sub = document.createElement("div");
    sub.className = "cat-sub";
    sub.textContent = `必须任务 ${catProgress(cat.id)}%`;
    header.appendChild(sub);

    card.appendChild(header);
    card.appendChild(buildGroup(cat, "required", "必须", false));
    card.appendChild(buildGroup(cat, "optional", "可选", true));
    return card;
  }

  header.appendChild(topRow);
  card.appendChild(header);
  card.appendChild(buildGroup(cat, "required", "必须", false));
  card.appendChild(buildGroup(cat, "optional", "可选", true));
  return card;
}

function buildCategoryEditForm(cat) {
  const form = document.createElement("div");
  form.className = "cat-edit-form";

  const iconInput = document.createElement("input");
  iconInput.type = "text";
  iconInput.className = "cat-icon-input";
  iconInput.value = cat.icon;
  iconInput.maxLength = 4;

  const nameInput = document.createElement("input");
  nameInput.type = "text";
  nameInput.className = "cat-name-input";
  nameInput.value = cat.name;
  nameInput.maxLength = 24;

  const save = async () => {
    const icon = iconInput.value.trim() || "📋";
    const name = nameInput.value.trim();
    if (!name) return;
    editingCategoryId = null;
    await updateCategory(cat.id, { icon, name });
  };
  const cancel = () => { editingCategoryId = null; renderApp(); };

  nameInput.addEventListener("keydown", e => {
    if (e.key === "Enter") save();
    if (e.key === "Escape") cancel();
  });
  iconInput.addEventListener("keydown", e => {
    if (e.key === "Enter") save();
    if (e.key === "Escape") cancel();
  });

  form.appendChild(iconInput);
  form.appendChild(nameInput);
  form.appendChild(makeIconBtn("✔", "保存", save));
  form.appendChild(makeIconBtn("✕", "取消", cancel));
  setTimeout(() => nameInput.focus(), 0);
  return form;
}

function buildGroup(cat, grp, label, optional) {
  const group = document.createElement("div");
  group.className = "task-group";

  const lbl = document.createElement("div");
  lbl.className = "group-label" + (optional ? " optional" : "");
  lbl.textContent = label;
  group.appendChild(lbl);

  const ul = document.createElement("ul");
  ul.className = "task-list";
  tasksFor(cat.id, grp).forEach(t => ul.appendChild(buildTaskItem(t)));
  group.appendChild(ul);

  const addKey = cat.id + ":" + grp;
  if (addingTaskGroup === addKey) {
    group.appendChild(buildAddTaskForm(cat, grp));
  } else {
    const addRow = document.createElement("div");
    addRow.className = "add-task-row";
    addRow.textContent = "+ 添加任务";
    addRow.addEventListener("click", () => { addingTaskGroup = addKey; renderApp(); });
    group.appendChild(addRow);
  }

  return group;
}

function buildTaskItem(t) {
  const li = document.createElement("li");

  if (editingTaskId === t.id) {
    li.className = "task-item editing";
    const input = document.createElement("input");
    input.type = "text";
    input.className = "task-edit-input";
    input.value = t.label;
    input.maxLength = 60;

    const save = async () => {
      const label = input.value.trim();
      editingTaskId = null;
      if (!label) { renderApp(); return; }
      await updateTaskLabel(t.id, label);
    };
    const cancel = () => { editingTaskId = null; renderApp(); };
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") save();
      if (e.key === "Escape") cancel();
    });

    li.appendChild(input);
    li.appendChild(makeIconBtn("✔", "保存", save));
    li.appendChild(makeIconBtn("✕", "取消", cancel));
    setTimeout(() => input.focus(), 0);
    return li;
  }

  li.className = "task-item" + (t.checked ? " done" : "");

  const box = document.createElement("span");
  box.className = "box";
  box.textContent = "✓";

  const labelEl = document.createElement("span");
  labelEl.className = "label";
  labelEl.textContent = t.label;

  const by = document.createElement("span");
  by.className = "by";
  by.textContent = t.checked && t.checked_by ? t.checked_by : "";

  const actions = document.createElement("span");
  actions.className = "task-actions";
  actions.appendChild(makeIconBtn("✏️", "编辑", () => { editingTaskId = t.id; renderApp(); }));
  actions.appendChild(makeIconBtn("🗑️", "删除", () => deleteTask(t)));

  li.appendChild(box);
  li.appendChild(labelEl);
  li.appendChild(by);
  li.appendChild(actions);
  li.addEventListener("click", () => toggleTask(t));
  return li;
}

function buildAddTaskForm(cat, grp) {
  const row = document.createElement("div");
  row.className = "add-task-form";

  const input = document.createElement("input");
  input.type = "text";
  input.className = "add-task-input";
  input.placeholder = "任务名称";
  input.maxLength = 60;

  const save = async () => {
    const label = input.value.trim();
    addingTaskGroup = null;
    if (!label) { renderApp(); return; }
    await addTask(cat.id, grp, label);
  };
  const cancel = () => { addingTaskGroup = null; renderApp(); };

  input.addEventListener("keydown", e => {
    if (e.key === "Enter") save();
    if (e.key === "Escape") cancel();
  });

  row.appendChild(input);
  row.appendChild(makeIconBtn("✔", "添加", save));
  row.appendChild(makeIconBtn("✕", "取消", cancel));
  setTimeout(() => input.focus(), 0);
  return row;
}

function buildAddCategoryCard() {
  const card = document.createElement("div");
  card.className = "cat-card add-cat-card";

  if (addingCategory) {
    const form = document.createElement("div");
    form.className = "cat-edit-form add-cat-form";

    const iconInput = document.createElement("input");
    iconInput.type = "text";
    iconInput.className = "cat-icon-input";
    iconInput.placeholder = "🏷️";
    iconInput.maxLength = 4;

    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.className = "cat-name-input";
    nameInput.placeholder = "分类名称";
    nameInput.maxLength = 24;

    const save = async () => {
      const icon = iconInput.value.trim() || "📋";
      const name = nameInput.value.trim();
      addingCategory = false;
      if (!name) { renderApp(); return; }
      await addCategory(icon, name);
    };
    const cancel = () => { addingCategory = false; renderApp(); };

    nameInput.addEventListener("keydown", e => {
      if (e.key === "Enter") save();
      if (e.key === "Escape") cancel();
    });
    iconInput.addEventListener("keydown", e => {
      if (e.key === "Enter") save();
      if (e.key === "Escape") cancel();
    });

    form.appendChild(iconInput);
    form.appendChild(nameInput);
    form.appendChild(makeIconBtn("✔", "添加", save));
    form.appendChild(makeIconBtn("✕", "取消", cancel));
    card.appendChild(form);
    setTimeout(() => nameInput.focus(), 0);
  } else {
    const trigger = document.createElement("div");
    trigger.className = "add-cat-trigger";
    trigger.textContent = "+ 新建分类";
    trigger.addEventListener("click", () => { addingCategory = true; renderApp(); });
    card.appendChild(trigger);
  }

  return card;
}

// ---- CRUD: categories ----

async function addCategory(icon, name) {
  const sortOrder = categories.length ? Math.max(...categories.map(c => c.sort_order)) + 1 : 0;
  const { data, error } = await client.from(CATEGORIES_TABLE)
    .insert({ room, icon, name, sort_order: sortOrder }).select().single();
  if (error) { console.error(error); renderApp(); return; }
  categories.push(data);
  renderApp();
}

async function updateCategory(id, patch) {
  const { data, error } = await client.from(CATEGORIES_TABLE)
    .update(patch).eq("id", id).select().single();
  if (error) { console.error(error); renderApp(); return; }
  const idx = categories.findIndex(c => c.id === id);
  if (idx >= 0) categories[idx] = data;
  renderApp();
}

async function deleteCategory(cat) {
  if (!confirm(`确定删除分类「${cat.name}」吗?其中的所有任务也会一并删除。`)) return;
  const { error } = await client.from(CATEGORIES_TABLE).delete().eq("id", cat.id);
  if (error) { console.error(error); return; }
  categories = categories.filter(c => c.id !== cat.id);
  tasks = tasks.filter(t => t.category_id !== cat.id);
  renderApp();
}

// ---- CRUD: tasks ----

async function addTask(categoryId, grp, label) {
  const siblings = tasksFor(categoryId, grp);
  const sortOrder = siblings.length ? Math.max(...siblings.map(t => t.sort_order)) + 1 : 0;
  const { data, error } = await client.from(TASKS_TABLE)
    .insert({ room, category_id: categoryId, grp, label, sort_order: sortOrder }).select().single();
  if (error) { console.error(error); renderApp(); return; }
  tasks.push(data);
  renderApp();
}

async function updateTaskLabel(id, label) {
  const { data, error } = await client.from(TASKS_TABLE)
    .update({ label, updated_at: new Date().toISOString() }).eq("id", id).select().single();
  if (error) { console.error(error); renderApp(); return; }
  const idx = tasks.findIndex(t => t.id === id);
  if (idx >= 0) tasks[idx] = data;
  renderApp();
}

async function deleteTask(t) {
  if (!confirm(`确定删除任务「${t.label}」吗?`)) return;
  const { error } = await client.from(TASKS_TABLE).delete().eq("id", t.id);
  if (error) { console.error(error); return; }
  tasks = tasks.filter(x => x.id !== t.id);
  renderApp();
}

async function toggleTask(t) {
  const patch = {
    checked: !t.checked,
    checked_by: !t.checked ? playerName : null,
    updated_at: new Date().toISOString()
  };
  const idx = tasks.findIndex(x => x.id === t.id);
  if (idx >= 0) tasks[idx] = { ...tasks[idx], ...patch };
  renderApp();
  const { error } = await client.from(TASKS_TABLE).update(patch).eq("id", t.id);
  if (error) console.error(error);
}

// ---- data load + realtime ----

async function loadInitialData() {
  const [{ data: cats, error: catErr }, { data: tsk, error: taskErr }] = await Promise.all([
    client.from(CATEGORIES_TABLE).select("*").eq("room", room),
    client.from(TASKS_TABLE).select("*").eq("room", room)
  ]);
  if (catErr) console.error(catErr);
  if (taskErr) console.error(taskErr);
  categories = cats || [];
  tasks = tsk || [];
  renderApp();
}

function applyCategoryChange(payload) {
  const row = payload.new && Object.keys(payload.new).length ? payload.new : payload.old;
  if (!row) return;
  if (payload.eventType === "DELETE") {
    categories = categories.filter(c => c.id !== row.id);
    tasks = tasks.filter(t => t.category_id !== row.id);
  } else {
    const idx = categories.findIndex(c => c.id === row.id);
    if (idx >= 0) categories[idx] = row; else categories.push(row);
  }
  renderApp();
}

function applyTaskChange(payload) {
  const row = payload.new && Object.keys(payload.new).length ? payload.new : payload.old;
  if (!row) return;
  if (payload.eventType === "DELETE") {
    tasks = tasks.filter(t => t.id !== row.id);
  } else {
    const idx = tasks.findIndex(t => t.id === row.id);
    if (idx >= 0) tasks[idx] = row; else tasks.push(row);
  }
  renderApp();
}

function renderPresence(presenceState) {
  const names = new Set();
  Object.values(presenceState).forEach(entries => {
    entries.forEach(e => { if (e.name) names.add(e.name); });
  });
  const row = document.getElementById("onlineRow");
  row.innerHTML = "";
  const label = document.createElement("span");
  label.className = "online-label";
  label.textContent = names.size ? `在线 (${names.size}):` : "当前没有人在线";
  row.appendChild(label);
  names.forEach(n => {
    const chip = document.createElement("span");
    chip.className = "online-chip";
    const dot = document.createElement("span");
    dot.className = "dot";
    chip.appendChild(dot);
    chip.appendChild(document.createTextNode(n));
    row.appendChild(chip);
  });
}

function trackPresenceIfReady() {
  if (channel && playerName) {
    channel.track({ name: playerName, online_at: new Date().toISOString() });
  }
}

function subscribeRealtime() {
  channel = client.channel(`room-${room}`, { config: { presence: { key: sessionId } } })
    .on("postgres_changes", { event: "*", schema: "public", table: CATEGORIES_TABLE, filter: `room=eq.${room}` }, applyCategoryChange)
    .on("postgres_changes", { event: "*", schema: "public", table: TASKS_TABLE, filter: `room=eq.${room}` }, applyTaskChange)
    .on("presence", { event: "sync" }, () => { renderPresence(channel.presenceState()); })
    .subscribe(status => {
      setStatus(status === "SUBSCRIBED");
      if (status === "SUBSCRIBED") trackPresenceIfReady();
    });
}

function initRoomUI() {
  document.getElementById("roomInput").value = room;
  document.getElementById("copyLinkBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(window.location.href).then(() => {
      const btn = document.getElementById("copyLinkBtn");
      const old = btn.textContent;
      btn.textContent = "已复制!";
      setTimeout(() => { btn.textContent = old; }, 1500);
    });
  });
  document.getElementById("playerLabel").textContent = playerName ? `你是: ${playerName}` : "";
  document.getElementById("templateBtn").addEventListener("click", () => {
    templatePanelOpen = !templatePanelOpen;
    renderApp();
  });
}

function initNameGate() {
  const gate = document.getElementById("nameGate");
  if (playerName) {
    gate.classList.add("hidden");
    return;
  }
  const input = document.getElementById("nameInput");
  const submit = document.getElementById("nameSubmit");
  function commit() {
    const v = input.value.trim();
    if (!v) return;
    playerName = v;
    localStorage.setItem("dst_planner_name", v);
    document.getElementById("playerLabel").textContent = `你是: ${playerName}`;
    gate.classList.add("hidden");
    trackPresenceIfReady();
  }
  submit.addEventListener("click", commit);
  input.addEventListener("keydown", e => { if (e.key === "Enter") commit(); });
  input.focus();
}

async function main() {
  room = getOrCreateRoom();
  initRoomUI();
  initNameGate();
  renderApp();

  client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  await loadInitialData();
  subscribeRealtime();
}

main();
</script>
