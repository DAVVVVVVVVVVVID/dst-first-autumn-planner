<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🍂 第一个秋天 · DST 协作规划</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍂</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #f3e4c8;
    --paper-dark: #ead4a8;
    --wood-dark: #3d2b1e;
    --wood: #6b4a34;
    --wood-light: #8a6248;
    --ink: #3d2b1e;
    --ink-soft: #6b5544;
    --orange: #c9752f;
    --orange-deep: #a85c1f;
    --orange-light: #e8a05c;
    --red: #b3462c;
    --yellow: #c98a17;
    --green: #5f7d3f;
    --border: rgba(61,43,30,0.25);
    --card-bg: #faf1dd;
    --shadow: 0 2px 0 rgba(61,43,30,0.15), 0 6px 16px rgba(61,43,30,0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 15% 10%, rgba(232,160,92,0.25), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(107,74,52,0.15), transparent 45%),
      var(--paper);
    color: var(--ink);
    font-family: "Noto Sans SC", sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  header.app-header {
    background: linear-gradient(135deg, var(--wood-dark), var(--wood));
    color: #f3e4c8;
    border-radius: 16px;
    padding: 22px 24px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    margin-bottom: 20px;
  }
  header.app-header::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 12px);
    pointer-events: none;
  }
  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .title-row h1 {
    font-family: "Ma Shan Zheng", cursive;
    font-size: 2.2rem;
    margin: 0;
    letter-spacing: 2px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.82rem;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #7fbf6a; box-shadow: 0 0 6px #7fbf6a; }
  .dot.offline { background: #c0392b; box-shadow: 0 0 6px #c0392b; }

  .room-row {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 0.88rem;
    color: #e8d8ba;
  }
  .room-row input[type=text] {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 0.85rem;
    width: 140px;
  }
  .room-row input[type=text]::placeholder { color: #d8c6a8; }

  .online-row {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 0.82rem;
  }
  .online-label { color: #d8c6a8; }
  .online-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    color: #f3e4c8;
  }
  .online-chip .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #7fbf6a; box-shadow: 0 0 5px #7fbf6a;
  }

  button.pill-btn {
    background: var(--orange);
    color: #fff;
    border: none;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 0.82rem;
    cursor: pointer;
    font-weight: 700;
    transition: background 0.15s, transform 0.1s;
  }
  button.pill-btn:hover { background: var(--orange-deep); }
  button.pill-btn:active { transform: scale(0.96); }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .stat-card h3 {
    margin: 0 0 10px;
    font-size: 0.9rem;
    color: var(--ink-soft);
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .stat-card .big-pct { font-size: 1.4rem; color: var(--orange-deep); font-weight: 900; }

  .bar-track {
    background: rgba(61,43,30,0.12);
    border-radius: 999px;
    height: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .bar-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--orange-light), var(--orange));
    transition: width 0.4s ease;
  }
  .bar-fill.required { background: linear-gradient(90deg, #d9663f, var(--red)); }
  .bar-fill.small { }

  .categories {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
  }

  .cat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .cat-header {
    padding: 14px 18px 10px;
    border-bottom: 1px dashed var(--border);
  }
  .cat-header .cat-name {
    font-size: 1.05rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .cat-header .cat-sub {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-top: 6px;
  }

  .task-group { padding: 10px 18px; }
  .task-group + .task-group { border-top: 1px dashed var(--border); }
  .group-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--red);
    margin: 6px 0 6px;
  }
  .group-label.optional { color: var(--yellow); }

  ul.task-list { list-style: none; margin: 0; padding: 0; }
  .task-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 4px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .task-item:hover { background: rgba(201,117,47,0.1); }
  .task-item .box {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    border-radius: 5px;
    border: 2px solid var(--wood);
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    font-size: 0.75rem;
    color: transparent;
  }
  .task-item.done .box {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .task-item.done .label {
    text-decoration: line-through;
    color: var(--ink-soft);
  }
  .task-item .label { flex: 1; font-size: 0.92rem; }
  .task-item .by {
    font-size: 0.72rem;
    color: var(--ink-soft);
    background: rgba(61,43,30,0.08);
    padding: 2px 7px;
    border-radius: 999px;
  }

  .name-gate {
    position: fixed;
    inset: 0;
    background: rgba(61,43,30,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .name-gate .box {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 28px;
    max-width: 360px;
    width: 100%;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .name-gate h2 { font-family: "Ma Shan Zheng", cursive; font-size: 1.8rem; margin: 0 0 6px; color: var(--wood-dark); }
  .name-gate p { color: var(--ink-soft); font-size: 0.85rem; margin: 0 0 16px; }
  .name-gate input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 1rem;
    margin-bottom: 12px;
    font-family: inherit;
  }
  .name-gate button {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: var(--orange);
    color: #fff;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .name-gate button:hover { background: var(--orange-deep); }
  .hidden { display: none !important; }

  footer.note {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.75rem;
    margin-top: 24px;
  }

  @media (max-width: 480px) {
    .title-row h1 { font-size: 1.6rem; }
    .wrap { padding: 12px 10px 30px; }
  }
</style>
</head>
<body>

<div class="name-gate" id="nameGate">
  <div class="box">
    <h2>🍂 加入营地</h2>
    <p>输入你的名字,让队友知道是谁完成了任务</p>
    <input type="text" id="nameInput" placeholder="例如: Alice" maxlength="12" />
    <button id="nameSubmit">进入</button>
  </div>
</div>

<div class="wrap">
  <header class="app-header">
    <div class="title-row">
      <h1>🍂 第一个秋天</h1>
      <span class="status-pill"><span class="dot offline" id="statusDot"></span><span id="statusText">连接中...</span></span>
    </div>
    <div class="room-row">
      <span>房间:</span>
      <input type="text" id="roomInput" readonly />
      <button class="pill-btn" id="copyLinkBtn">复制邀请链接</button>
      <span id="playerLabel"></span>
    </div>
    <div class="online-row" id="onlineRow"></div>
  </header>

  <div class="stats-row">
    <div class="stat-card">
      <h3>必须任务完成度 <span class="big-pct" id="requiredPct">0%</span></h3>
      <div class="bar-track"><div class="bar-fill required" id="requiredBar" style="width:0%"></div></div>
    </div>
    <div class="stat-card">
      <h3>总进度(含可选) <span class="big-pct" id="totalPct">0%</span></h3>
      <div class="bar-track"><div class="bar-fill" id="totalBar" style="width:0%"></div></div>
    </div>
  </div>

  <div class="categories" id="categories"></div>

  <footer class="note">数据实时同步给同房间的所有人 · 分享上方链接给队友即可一起协作</footer>
</div>

<script>
const SUPABASE_URL = "https://tldmpaumprctfpqzbgga.supabase.co";
const SUPABASE_KEY = "sb_publishable_cps3c_C2OJ4ph6R81PEang_o8SvPi9J";
const TABLE = "task_state";

const CATEGORIES = [
  {
    id: "explore", icon: "🗺️", name: "探索地图",
    required: [
      ["pig-king", "猪王"], ["cow-herd", "牛群"], ["grass-field", "草原"],
      ["spider-nest", "蜘蛛巢"], ["rock-area", "岩石区域"], ["rabbit-area", "兔子区"],
      ["clockwork", "发条怪物"], ["walrus-plains", "海象平原"], ["glommer", "格罗姆"]
    ],
    optional: [
      ["swamp", "沼泽"], ["graveyard", "墓地"], ["beehive", "蜂巢"], ["cave", "洞穴"]
    ]
  },
  {
    id: "resource", icon: "🌱", name: "资源移植",
    required: [
      ["berry-bush", "浆果丛移植"], ["sapling", "树枝移植"], ["tree-planting", "种树"],
      ["spider-nest-3", "蜘蛛巢 ×3"], ["pig-house-6", "猪人房 ×6"], ["birdcage", "鸟笼"]
    ],
    optional: [
      ["grass-transplant", "草移植(有草原可以不进行)"], ["beebox", "蜂箱"], ["bunnyman-house", "兔人房"]
    ]
  },
  {
    id: "base", icon: "🏠", name: "家具必需品",
    required: [
      ["firepit", "火坑"], ["drying-rack", "晾肉架"], ["science-machine", "一本科技"],
      ["alchemy-engine", "二本科技"], ["crockpot-3", "烹饪锅 ×3"], ["icebox-3", "冰箱 ×3"],
      ["tent", "帐篷"], ["chests", "箱子及其分类"]
    ],
    optional: [
      ["sea-tech", "海上科技"]
    ]
  },
  {
    id: "gear", icon: "⚔️", name: "装备",
    required: [
      ["pig-hat", "猪皮头套"]
    ],
    optional: [
      ["miner-hat", "矿工帽"], ["lantern", "提灯"]
    ]
  },
  {
    id: "winter", icon: "❄️", name: "过冬准备",
    required: [
      ["beefalo-hat-3", "牛角帽 ×3"], ["heat-stone-6", "暖石 ×6"], ["fuel", "充足燃料"]
    ],
    optional: []
  }
];

const state = {}; // task_id -> {checked, checked_by}
let playerName = localStorage.getItem("dst_planner_name") || "";
let room = "";
let channel = null;
let client = null;
const sessionId = crypto.randomUUID ? crypto.randomUUID() : String(Math.random());

function taskFullId(catId, key) { return catId + "--" + key; }

function getOrCreateRoom() {
  const url = new URL(window.location.href);
  let r = url.searchParams.get("room");
  if (!r) {
    r = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random())).slice(0, 8);
    url.searchParams.set("room", r);
    window.history.replaceState({}, "", url.toString());
  }
  return r;
}

function setStatus(online) {
  document.getElementById("statusDot").classList.toggle("offline", !online);
  document.getElementById("statusText").textContent = online ? "实时同步中" : "离线 / 连接中";
}

function computeProgress() {
  let reqTotal = 0, reqDone = 0, allTotal = 0, allDone = 0;
  CATEGORIES.forEach(cat => {
    cat.required.forEach(([key]) => {
      reqTotal++; allTotal++;
      const s = state[taskFullId(cat.id, key)];
      if (s && s.checked) { reqDone++; allDone++; }
    });
    cat.optional.forEach(([key]) => {
      allTotal++;
      const s = state[taskFullId(cat.id, key)];
      if (s && s.checked) { allDone++; }
    });
  });
  return {
    reqPct: reqTotal ? Math.round((reqDone / reqTotal) * 100) : 0,
    allPct: allTotal ? Math.round((allDone / allTotal) * 100) : 0
  };
}

function catProgress(cat) {
  const total = cat.required.length;
  const done = cat.required.filter(([key]) => {
    const s = state[taskFullId(cat.id, key)];
    return s && s.checked;
  }).length;
  return total ? Math.round((done / total) * 100) : 0;
}

function renderStats() {
  const { reqPct, allPct } = computeProgress();
  document.getElementById("requiredPct").textContent = reqPct + "%";
  document.getElementById("requiredBar").style.width = reqPct + "%";
  document.getElementById("totalPct").textContent = allPct + "%";
  document.getElementById("totalBar").style.width = allPct + "%";
}

function buildCategoryCard(cat) {
  const card = document.createElement("div");
  card.className = "cat-card";

  const header = document.createElement("div");
  header.className = "cat-header";
  header.innerHTML = `
    <div class="cat-name">${cat.icon} ${cat.name}</div>
    <div class="bar-track"><div class="bar-fill" id="bar-${cat.id}" style="width:0%"></div></div>
    <div class="cat-sub" id="sub-${cat.id}"></div>
  `;
  card.appendChild(header);

  function buildGroup(label, items, optional) {
    if (!items.length) return;
    const group = document.createElement("div");
    group.className = "task-group";
    const lbl = document.createElement("div");
    lbl.className = "group-label" + (optional ? " optional" : "");
    lbl.textContent = optional ? "可选" : "必须";
    group.appendChild(lbl);
    const ul = document.createElement("ul");
    ul.className = "task-list";
    items.forEach(([key, text]) => {
      const id = taskFullId(cat.id, key);
      const li = document.createElement("li");
      li.className = "task-item";
      li.dataset.taskId = id;
      li.innerHTML = `<span class="box">✓</span><span class="label">${text}</span><span class="by"></span>`;
      li.addEventListener("click", () => toggleTask(id));
      ul.appendChild(li);
    });
    group.appendChild(ul);
    card.appendChild(group);
  }

  buildGroup("必须", cat.required, false);
  buildGroup("可选", cat.optional, true);

  return card;
}

function renderCategories() {
  const wrap = document.getElementById("categories");
  wrap.innerHTML = "";
  CATEGORIES.forEach(cat => wrap.appendChild(buildCategoryCard(cat)));
}

function renderTaskItem(fullId) {
  const li = document.querySelector(`.task-item[data-task-id="${fullId}"]`);
  if (!li) return;
  const s = state[fullId];
  const done = !!(s && s.checked);
  li.classList.toggle("done", done);
  const by = li.querySelector(".by");
  by.textContent = done && s.checked_by ? s.checked_by : "";
}

function renderAll() {
  Object.keys(state).forEach(renderTaskItem);
  renderStats();
  CATEGORIES.forEach(cat => {
    const pct = catProgress(cat);
    const bar = document.getElementById(`bar-${cat.id}`);
    const sub = document.getElementById(`sub-${cat.id}`);
    if (bar) bar.style.width = pct + "%";
    if (sub) sub.textContent = `必须任务 ${pct}%`;
  });
}

async function toggleTask(fullId) {
  const current = state[fullId] || { checked: false, checked_by: null };
  const next = {
    checked: !current.checked,
    checked_by: !current.checked ? playerName : null
  };
  state[fullId] = next;
  renderTaskItem(fullId);
  renderStats();
  updateCatBarFor(fullId);

  const [catId, key] = splitFullId(fullId);
  await client.from(TABLE).upsert({
    room,
    task_id: fullId,
    checked: next.checked,
    checked_by: next.checked_by,
    updated_at: new Date().toISOString()
  }, { onConflict: "room,task_id" });
}

function splitFullId(fullId) {
  const idx = fullId.indexOf("--");
  return [fullId.slice(0, idx), fullId.slice(idx + 2)];
}

function updateCatBarFor(fullId) {
  const [catId] = splitFullId(fullId);
  const cat = CATEGORIES.find(c => c.id === catId);
  if (!cat) return;
  const pct = catProgress(cat);
  const bar = document.getElementById(`bar-${cat.id}`);
  const sub = document.getElementById(`sub-${cat.id}`);
  if (bar) bar.style.width = pct + "%";
  if (sub) sub.textContent = `必须任务 ${pct}%`;
}

async function loadInitialState() {
  const { data, error } = await client.from(TABLE).select("*").eq("room", room);
  if (error) {
    console.error(error);
    return;
  }
  data.forEach(row => {
    state[row.task_id] = { checked: row.checked, checked_by: row.checked_by };
  });
  renderAll();
}

function renderPresence(presenceState) {
  const names = new Set();
  Object.values(presenceState).forEach(entries => {
    entries.forEach(e => { if (e.name) names.add(e.name); });
  });
  const row = document.getElementById("onlineRow");
  row.innerHTML = "";
  const label = document.createElement("span");
  label.className = "online-label";
  label.textContent = names.size ? `在线 (${names.size}):` : "当前没有人在线";
  row.appendChild(label);
  names.forEach(n => {
    const chip = document.createElement("span");
    chip.className = "online-chip";
    const dot = document.createElement("span");
    dot.className = "dot";
    chip.appendChild(dot);
    chip.appendChild(document.createTextNode(n));
    row.appendChild(chip);
  });
}

function trackPresenceIfReady() {
  if (channel && playerName) {
    channel.track({ name: playerName, online_at: new Date().toISOString() });
  }
}

function subscribeRealtime() {
  channel = client.channel(`room-${room}`, { config: { presence: { key: sessionId } } })
    .on("postgres_changes", { event: "*", schema: "public", table: TABLE, filter: `room=eq.${room}` }, payload => {
      const row = payload.new && Object.keys(payload.new).length ? payload.new : payload.old;
      if (!row) return;
      if (payload.eventType === "DELETE") {
        delete state[row.task_id];
      } else {
        state[row.task_id] = { checked: row.checked, checked_by: row.checked_by };
      }
      renderTaskItem(row.task_id);
      renderStats();
      updateCatBarFor(row.task_id);
    })
    .on("presence", { event: "sync" }, () => {
      renderPresence(channel.presenceState());
    })
    .subscribe(status => {
      setStatus(status === "SUBSCRIBED");
      if (status === "SUBSCRIBED") trackPresenceIfReady();
    });
}

function initRoomUI() {
  document.getElementById("roomInput").value = room;
  document.getElementById("copyLinkBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(window.location.href).then(() => {
      const btn = document.getElementById("copyLinkBtn");
      const old = btn.textContent;
      btn.textContent = "已复制!";
      setTimeout(() => { btn.textContent = old; }, 1500);
    });
  });
  document.getElementById("playerLabel").textContent = playerName ? `你是: ${playerName}` : "";
}

function initNameGate() {
  const gate = document.getElementById("nameGate");
  if (playerName) {
    gate.classList.add("hidden");
    return;
  }
  const input = document.getElementById("nameInput");
  const submit = document.getElementById("nameSubmit");
  function commit() {
    const v = input.value.trim();
    if (!v) return;
    playerName = v;
    localStorage.setItem("dst_planner_name", v);
    document.getElementById("playerLabel").textContent = `你是: ${playerName}`;
    gate.classList.add("hidden");
    trackPresenceIfReady();
  }
  submit.addEventListener("click", commit);
  input.addEventListener("keydown", e => { if (e.key === "Enter") commit(); });
  input.focus();
}

async function main() {
  room = getOrCreateRoom();
  initRoomUI();
  initNameGate();
  renderCategories();
  renderAll();

  client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  await loadInitialState();
  subscribeRealtime();
}

main();
</script>
